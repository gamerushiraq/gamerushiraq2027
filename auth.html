<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06070b">
<meta name="description" content="GameRush Iraq — تسجيل الدخول الآمن">
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="theme-2026.css?v=2">
<title>GameRush Iraq — تسجيل الدخول</title>
<style>
:root{--a:#b7ff2a;--c:#00e5ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#16283d 0,#080b12 38%,#05070c 75%);color:#fff;font-family:Cairo,Arial,sans-serif}.gr-auth-page{min-height:100vh;display:grid;place-items:center;padding:22px;position:relative;overflow:hidden}.gr-auth-page:before,.gr-auth-page:after{content:"";position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none;opacity:.18}.gr-auth-page:before{width:340px;height:340px;background:var(--a);top:-160px;right:-100px}.gr-auth-page:after{width:300px;height:300px;background:var(--c);bottom:-150px;left:-100px}.gr-auth-shell{width:min(470px,100%);position:relative;z-index:1}.gr-auth-brand{text-align:center;margin-bottom:18px}.gr-auth-brand b{font-size:30px;font-weight:1000}.gr-auth-brand small{display:block;color:var(--c);font-size:9px;font-weight:900;letter-spacing:3px}.gr-auth-card{background:rgba(9,14,23,.9);border:1px solid #23334a;border-radius:28px;padding:26px;box-shadow:0 30px 100px #0009;backdrop-filter:blur(18px)}.eyebrow{color:var(--a);font-size:10px;font-weight:900;letter-spacing:1.5px}.gr-auth-card h1{font-size:30px;line-height:1.2;margin:8px 0}.gr-auth-card>p{color:#91a0b4;font-size:12px;line-height:1.8;margin:0 0 18px}.gr-auth-choice{display:grid;gap:10px}.gr-auth-provider,.gr-auth-phone-submit,.gr-auth-verify{min-height:52px;border-radius:15px;border:1px solid #263950;background:#0d1522;color:#fff;font:900 13px Cairo,sans-serif;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:10px}.gr-auth-provider:hover,.gr-auth-phone-submit:hover,.gr-auth-verify:hover{transform:translateY(-1px)}.gr-auth-provider.google{background:#fff;color:#111827;border-color:#fff}.gr-auth-provider.phone{background:linear-gradient(135deg,#b7ff2a,#7ed600);color:#07100a;border-color:#b7ff2a}.gr-auth-icon{width:23px;height:23px;display:grid;place-items:center;font-size:17px}.gr-auth-divider{display:flex;align-items:center;gap:10px;color:#68778b;font-size:10px;margin:16px 0}.gr-auth-divider:before,.gr-auth-divider:after{content:"";height:1px;background:#203047;flex:1}.gr-auth-phone{display:none}.gr-auth-phone.open{display:block}.gr-auth-phone label{display:block;color:#dce5f0;font-size:11px;font-weight:900;margin:9px 0 6px}.gr-auth-input{width:100%;min-height:50px;border:1px solid #263950;border-radius:14px;background:#070d17;color:#fff;padding:12px 14px;font:700 14px Cairo,sans-serif;outline:none}.gr-auth-input:focus{border-color:var(--c);box-shadow:0 0 0 3px #00e5ff18}.gr-phone-number{display:grid;grid-template-columns:86px 1fr;gap:8px;align-items:center}.gr-phone-number span{min-height:50px;border:1px solid #263950;border-radius:14px;background:#101a29;color:var(--a);display:grid;place-items:center;font:900 14px Cairo,sans-serif;direction:ltr}.gr-auth-phone select{appearance:auto;cursor:pointer}.gr-auth-otp{display:none;margin-top:10px}.gr-auth-otp.open{display:block}.gr-auth-otp-row{display:grid;grid-template-columns:1fr auto;gap:8px}.gr-auth-verify{padding:0 18px;background:#172235}.gr-auth-back{margin-top:9px;border:0;background:transparent;color:#8fa0b5;font:800 11px Cairo,sans-serif;cursor:pointer}.gr-auth-status{min-height:23px;margin-top:13px;text-align:center;color:#91a0b4;font-size:11px;line-height:1.7}.gr-auth-status.error{color:#ff8c9e}.gr-auth-status.success{color:#b7ff2a}.gr-auth-foot{text-align:center;color:#627189;font-size:9px;margin-top:14px;line-height:1.7}.gr-auth-loading{opacity:.65;pointer-events:none}@media(max-width:480px){.gr-auth-page{padding:14px}.gr-auth-card{padding:21px;border-radius:23px}.gr-auth-card h1{font-size:25px}}
</style>
</head>
<body><main class="gr-auth-page"><div class="gr-auth-shell">
<div class="gr-auth-brand"><b>GameRush</b><small>IRAQ • TOP-UP SYSTEM</small></div>
<section class="gr-auth-card" aria-labelledby="authTitle"><span class="eyebrow">SECURE ACCESS</span>
<h1 id="authTitle">سجّل دخولك حتى تكمل</h1><p>الدخول مطلوب حتى نحفظ حسابك وطلباتك ونخلي تجربة GameRush أكثر أماناً.</p>
<div class="gr-auth-choice">
<button class="gr-auth-provider google" id="googleBtn" type="button"><span class="gr-auth-icon">G</span> المتابعة بحساب Google</button>
<button class="gr-auth-provider phone" id="phoneBtn" type="button"><span class="gr-auth-icon">☎</span> الدخول برقم الهاتف</button>
</div>
<div class="gr-auth-divider"><span>هاتف</span></div>
<div class="gr-auth-phone" id="phonePanel">
<label>الدولة</label><select id="countryCode" class="gr-auth-input" autocomplete="tel-country-code">
<option value="+964" data-example="07XXXXXXXXX">🇮🇶 العراق (+964)</option><option value="+966" data-example="05XXXXXXXX">🇸🇦 السعودية (+966)</option><option value="+971" data-example="05XXXXXXXX">🇦🇪 الإمارات (+971)</option><option value="+965" data-example="5XXXXXXX">🇰🇼 الكويت (+965)</option><option value="+974" data-example="3XXXXXXX">🇶🇦 قطر (+974)</option><option value="+973" data-example="3XXXXXXX">🇧🇭 البحرين (+973)</option><option value="+968" data-example="9XXXXXXX">🇴🇲 عُمان (+968)</option><option value="+962" data-example="7XXXXXXXX">🇯🇴 الأردن (+962)</option><option value="+20" data-example="10XXXXXXXX">🇪🇬 مصر (+20)</option><option value="+90" data-example="5XXXXXXXXX">🇹🇷 تركيا (+90)</option><option value="+44" data-example="7XXXXXXXXX">🇬🇧 بريطانيا (+44)</option><option value="+49" data-example="15XXXXXXXXX">🇩🇪 ألمانيا (+49)</option><option value="+33" data-example="6XXXXXXXX">🇫🇷 فرنسا (+33)</option><option value="+39" data-example="3XXXXXXXXX">🇮🇹 إيطاليا (+39)</option><option value="+34" data-example="6XXXXXXXX">🇪🇸 إسبانيا (+34)</option><option value="+1" data-example="XXXXXXXXXX">🇺🇸 الولايات المتحدة (+1)</option><option value="+1" data-example="XXXXXXXXXX">🇨🇦 كندا (+1)</option><option value="+61" data-example="4XXXXXXXX">🇦🇺 أستراليا (+61)</option><option value="+91" data-example="XXXXXXXXXX">🇮🇳 الهند (+91)</option>
</select>
<label for="phoneInput">رقم الهاتف</label><div class="gr-phone-number"><span id="selectedCode">+964</span><input id="phoneInput" class="gr-auth-input" inputmode="tel" autocomplete="tel-national" placeholder="07XXXXXXXXX" maxlength="15"></div>
<button class="gr-auth-phone-submit" id="sendOtpBtn" type="button" style="margin-top:9px;width:100%">إرسال رمز التحقق SMS</button>
<div class="gr-auth-otp" id="otpPanel"><label for="otpInput">رمز التحقق</label><div class="gr-auth-otp-row"><input id="otpInput" class="gr-auth-input" inputmode="numeric" autocomplete="one-time-code" placeholder="6 أرقام" maxlength="6"><button class="gr-auth-verify" id="verifyOtpBtn" type="button">تحقق</button></div><button class="gr-auth-back" id="resendBtn" type="button">إعادة إرسال الرمز</button></div>
<button class="gr-auth-back" id="closePhoneBtn" type="button">رجوع لخيارات الدخول</button></div>
<div class="gr-auth-status" id="authStatus" role="status" aria-live="polite"></div>
<div class="gr-auth-foot">🔐 لا نطلب كلمة مرور حساب اللعبة. بيانات الشحن تبقى منفصلة عن تسجيل الدخول.</div>
</section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth-page.js"></script>
</body></html>
