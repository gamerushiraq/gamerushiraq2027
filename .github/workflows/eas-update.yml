name: GameRush Android OTA Update

on:
  push:
    branches: [main]
    paths:
      - "mobile-app/**"
  workflow_dispatch:

jobs:
  publish-update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: mobile-app/package.json

      - name: Install dependencies
        run: npm install

      - name: Verify Expo project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas project:info --non-interactive

      - name: Publish preview update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas update --channel preview --message "GameRush mobile update ${{ github.sha }}" --environment preview --non-interactive
