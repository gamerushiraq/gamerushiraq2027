name: GameRush Mobile OTA Update
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "EAS Update channel"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production
      message:
        description: "Update message"
        required: true
        default: "Sync GameRush mobile app"
jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: mobile-app/package.json
      - name: Install dependencies
        run: npm install
      - name: Install EAS CLI
        run: npm install --global eas-cli
      - name: Publish OTA update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas update --channel "${{ inputs.channel }}" --message "${{ inputs.message }}" --environment production --non-interactive
