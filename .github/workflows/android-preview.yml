name: GameRush Android APK v2

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: mobile-app/package.json

      - name: Install dependencies
        run: npm install

      - name: Verify Expo dependency versions
        run: |
          set -e
          echo "Installed Expo / React Native / React versions:"
          node -e "for (const p of ['expo','react-native','react']) console.log(p, require('./node_modules/'+p+'/package.json').version)"
          node -e "const fs=require('fs');const p=require('./package.json');const checks=[['expo','~57.0.3'],['react-native','0.86.0'],['react','19.2.3']];for(const [k,v] of checks){if(p.dependencies[k]!==v){throw new Error('package.json '+k+' expected '+v+' but found '+p.dependencies[k])}}"
          node -e "const v=require('./node_modules/react-native/package.json').version;if(v!=='0.86.0'){throw new Error('Wrong React Native installed: '+v)};const fs=require('fs');if(!fs.existsSync('./node_modules/react-native/rn-get-polyfills.js')){throw new Error('React Native 0.86 polyfill file is missing')}"
          npx expo-doctor

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Create or link EAS project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -e
          eas init --account gamerushiraq2027 --force --json --non-interactive
          echo "EAS init finished."

      - name: Verify EAS project ID
        run: |
          set -e
          node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('app.json','utf8'));const id=a?.expo?.extra?.eas?.projectId;if(!id){console.error('ERROR: extra.eas.projectId is missing after eas init');process.exit(1)}console.log('EAS projectId linked:',id)"
          echo "EAS project verification passed."

      - name: Build Android APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive
