name: GameRush Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile-app/package.json

      - name: Install dependencies
        run: npm install

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Link and verify EAS project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas init --account gamerushiraq2027 --force --non-interactive
          echo "Checking EAS project configuration..."
          eas config --json --non-interactive
          node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('app.json','utf8'));const id=a?.expo?.extra?.eas?.projectId;if(!id){console.error('EAS projectId missing from app.json');process.exit(1)}console.log('EAS projectId linked:',id)"

      - name: Build Android APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive
