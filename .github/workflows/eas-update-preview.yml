name: GameRush Android OTA Update

on:
  push:
    branches:
      - main
    paths:
      - "mobile-app/**"

jobs:
  publish-update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: mobile-app/package.json

      - name: Install dependencies
        run: npm install

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Publish preview OTA update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -e
          eas update             --channel preview             --message "GameRush mobile update ${GITHUB_SHA::8}"             --environment preview             --non-interactive
