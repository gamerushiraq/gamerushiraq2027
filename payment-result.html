<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b14"><link rel="stylesheet" href="styles.css"><title>GameRush Iraq — نتيجة الدفع</title><script src="./auth-gate.js"></script>
</head><body><main style="min-height:100vh;display:grid;place-items:center;padding:20px"><section style="width:min(520px,100%);padding:28px;border:1px solid #24354b;border-radius:26px;background:#0a111e;color:#fff;text-align:center"><div style="font-size:48px">🔐</div><h1>تمت معالجة الدفع</h1><p id="msg" style="color:#9eacbd;line-height:1.8">إذا اكتملت العملية، راح يتحدث طلبك تلقائياً بعد وصول تأكيد بوابة الدفع.</p><p id="orderInfo" hidden style="margin:16px 0;color:#fff">رقم طلبك: <strong id="orderNumberValue"></strong></p><a class="primary" id="trackOrderLink" href="track.html">تتبع الطلب</a><a class="ghost" href="shop.html" style="display:inline-block;margin-top:10px">العودة للمتجر</a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const p=new URLSearchParams(location.search);const id=p.get("paymentId")||p.get("payment_id")||"";if(id)document.getElementById("msg").textContent="وصلنا رجوعك من بوابة الدفع. حالة الدفع النهائية يحددها الخادم بعد التحقق من إشعار البوابة، مو من رابط الرجوع.";let orderNo="";try{orderNo=sessionStorage.getItem("gamerush_pending_order_number")||localStorage.getItem("gamerush_pending_order_number")||"";}catch{}if(/^GR-[A-Z0-9]{8}(?:[A-Z0-9]{8})?$/.test(orderNo)){document.getElementById("orderInfo").hidden=false;document.getElementById("orderNumberValue").textContent=orderNo;document.getElementById("trackOrderLink").href="track.html?order="+encodeURIComponent(orderNo);}</script></body></html>
